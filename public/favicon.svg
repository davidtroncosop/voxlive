<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="10" y1="0" x2="35" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App icon tile with dark background and crisp border -->
  <rect width="64" height="64" rx="14" fill="url(#bg-grad)" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.5" />

  <!-- Official Voxlive geometric soundwave mark -->
  <g transform="translate(7.04, 13.28) scale(1.2)" fill="url(#logo-grad)" filter="url(#glow)">
    <polygon points="12,0 30,0 33.2,3.2 15.2,3.2" />
    <polygon points="14.6,5.6 32.6,5.6 35.8,8.8 17.8,8.8" />
    <polygon points="17.2,11.2 35.2,11.2 38.4,14.4 20.4,14.4" />
    <polygon points="3.2,16.8 21.2,16.8 24.4,20 6.4,20" />
    <polygon points="5.8,22.4 23.8,22.4 27,25.6 9,25.6" />
    <polygon points="8.4,28 26.4,28 29.6,31.2 11.6,31.2" />
  </g>
</svg>