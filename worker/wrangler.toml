#:schema node_modules/wrangler/config-schema.json
name = "voxlive-backend"
main = "src/index.ts"
compatibility_date = "2024-04-03"

# Durable Object bindings.
# Durable Objects are stateful serverless components that run on Cloudflare's Edge.
[[durable_objects.bindings]]
name = "TOUR_ROOM"
class_name = "TourRoom"

# Durable Object migration to create the class
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TourRoom"]

# Configuration for local development
[dev]
port = 8787
ip = "localhost"
